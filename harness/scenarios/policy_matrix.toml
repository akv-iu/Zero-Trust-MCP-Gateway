# Both sides of the published three-principal policy matrix.  Legitimate rows are
# deliberately broad: a gateway that denies everything must score badly here.
corpus_version = "0.1.0"

[[scenario]]
id = "matrix-intern-stat-public"
class = "legitimate"
layer = "security"
principal = "intern"
tool = "stat_file"
arguments = { path = "public/documentation.txt" }
expected_decision = "allow"
expected_reason = "POLICY_METADATA_READ"
expected_side_effect = { op = "stat", path_contains = "public/documentation.txt" }
risk_tier = "R0"
notes = "Intern metadata access to the public root."

[[scenario]]
id = "matrix-developer-read-public"
class = "legitimate"
layer = "security"
principal = "developer"
tool = "read_file"
arguments = { path = "public/changelog.md" }
expected_decision = "allow"
expected_reason = "POLICY_SCOPED_READ"
expected_side_effect = { op = "read", path_contains = "public/changelog.md" }
risk_tier = "R1"
notes = "Developer retains ordinary public read access."

[[scenario]]
id = "matrix-developer-list-workspace"
class = "legitimate"
layer = "security"
principal = "developer"
tool = "list_directory"
arguments = { path = "workspace" }
expected_decision = "allow"
expected_reason = "POLICY_METADATA_READ"
expected_side_effect = { op = "list", path_contains = "workspace" }
risk_tier = "R0"
notes = "Developer may list the writable workspace."

[[scenario]]
id = "matrix-developer-stat-workspace"
class = "legitimate"
layer = "security"
principal = "developer"
tool = "stat_file"
arguments = { path = "workspace/notes.txt" }
expected_decision = "allow"
expected_reason = "POLICY_METADATA_READ"
expected_side_effect = { op = "stat", path_contains = "workspace/notes.txt" }
risk_tier = "R0"
notes = "Developer metadata access is distinct from content read."

[[scenario]]
id = "matrix-developer-delete-workspace"
class = "legitimate"
layer = "security"
principal = "developer"
tool = "delete_file"
arguments = { path = "workspace/notes.txt" }
expected_decision = "allow"
expected_reason = "POLICY_SCOPED_WRITE"
expected_side_effect = { op = "delete", path_contains = "workspace/notes.txt" }
risk_tier = "R4"
notes = "The developer delete grant is exercised and reset after the row."

