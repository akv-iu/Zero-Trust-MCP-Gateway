arguments = { path = "workspace/scratch/intern.txt", content = "no" }
expected_decision = "deny"
expected_reason = "POLICY_OPERATION_NOT_PERMITTED"
expected_side_effect = "none"
risk_tier = "R2"
notes = "Intern has no write operation grant anywhere."

[[scenario]]
id = "matrix-developer-write-public-deny"
