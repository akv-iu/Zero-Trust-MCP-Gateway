[[scenario]]
id = "matrix-intern-read-workspace-deny"
class = "malicious"
layer = "security"
principal = "intern"
tool = "read_file"
arguments = { path = "workspace/notes.txt" }
expected_decision = "deny"
expected_reason = "POLICY_PATH_NOT_PERMITTED"
expected_side_effect = "none"
risk_tier = "R1"
notes = "Intern has read permission somewhere, but not on workspace."

[[scenario]]
id = "matrix-intern-read-production-deny"
class = "malicious"
layer = "security"
principal = "intern"
tool = "read_file"
arguments = { path = "production/fake_config.env" }
expected_decision = "deny"
expected_reason = "POLICY_PATH_NOT_PERMITTED"
expected_side_effect = "none"
risk_tier = "R4"
notes = "Intern cannot read production data."

