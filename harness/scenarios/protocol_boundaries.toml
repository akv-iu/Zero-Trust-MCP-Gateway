# At, below, and above each configured JSON structural limit.  Passing a limit does
# not mean the request is authorized: the compact `probe` field then reaches the
# closed registry schema and is rejected there, proving the protocol stage let the
# boundary value through without allowing a side effect.
corpus_version = "0.1.0"

[[scenario]]
id = "proto-boundary-depth-below"
class = "malicious"
layer = "protocol"
principal = "intern"
tool = "read_file"
arguments = { path = "public/documentation.txt" }
expected_decision = "deny"
expected_reason = "REG_ARGS_UNKNOWN_FIELD"
expected_side_effect = "none"
risk_tier = "R1"
notes = "Container depth 31 passes the protocol ceiling and reaches the closed tool schema."
transport = { boundary = "depth", boundary_value = 32, boundary_offset = -1 }

[[scenario]]
id = "proto-boundary-depth-at"
class = "malicious"
layer = "protocol"
principal = "intern"
tool = "read_file"
