expected_decision = "deny"
expected_reason = "REG_ARGS_UNKNOWN_FIELD"
expected_side_effect = "none"
risk_tier = "R1"
notes = "Container depth exactly 32 is accepted by both the byte prescan and parsed walk."
transport = { boundary = "depth", boundary_value = 32 }

[[scenario]]
id = "proto-boundary-depth-above"
class = "malicious"
layer = "protocol"
principal = "intern"
tool = "read_file"
arguments = { path = "public/documentation.txt" }
expected_decision = "deny"
expected_reason = "PROTO_LIMIT_EXCEEDED"
expected_side_effect = "none"
risk_tier = "R1"
notes = "Container depth 33 is rejected before registry or policy."
transport = { boundary = "depth", boundary_value = 32, boundary_offset = 1 }

