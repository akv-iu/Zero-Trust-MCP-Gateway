[[scenario]]
id = "chaos-upstream-hang-001"
class = "malicious"
layer = "chaos"
principal = "intern"
tool = "read_file"
arguments = { path = "public/documentation.txt" }
expected_decision = "deny"
expected_reason = "ROUTE_TIMEOUT"
