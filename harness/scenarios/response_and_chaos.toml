# Upstream and policy failures.  Each row selects a real deployment variant; none of
# these outcomes is produced by a stubbed client.
corpus_version = "0.1.0"

[[scenario]]
id = "resp-oversized-001"
class = "malicious"
layer = "security"
principal = "intern"
tool = "read_file"
arguments = { path = "public/documentation.txt" }
expected_decision = "deny"
expected_reason = "RESP_TOO_LARGE"
expected_side_effect = { op = "read", path_contains = "public/documentation.txt" }
risk_tier = "R1"
fixture_mode = "oversized"
notes = "The authorized read occurs, then a harness-bounded 1.1 MB result exceeds the live 1 MiB obligation and is rejected rather than truncated into success; the fixture default remains 100 MiB."

[[scenario]]
id = "resp-pathological-001"
class = "malicious"
layer = "security"
principal = "intern"
tool = "read_file"
arguments = { path = "public/changelog.md" }
expected_decision = "deny"
expected_reason = "RESP_LIMIT_EXCEEDED"
expected_side_effect = { op = "read", path_contains = "public/changelog.md" }
risk_tier = "R1"
fixture_mode = "pathological"
notes = "A response deeper and wider than the configured structure limits is rejected after the legitimate read."

[[scenario]]
id = "resp-malformed-001"
class = "malicious"
layer = "chaos"
principal = "intern"
tool = "read_file"
arguments = { path = "public/documentation.txt" }
expected_decision = "deny"
expected_reason = "ROUTE_TIMEOUT"
expected_side_effect = { op = "read", path_contains = "public/documentation.txt" }
risk_tier = "R1"
fixture_mode = "malformed"
notes = "The fixture completes the read but emits truncated JSON; the pinned SDK drops it and the bounded route times out."

[[scenario]]
id = "resp-wrong-id-001"
class = "malicious"
layer = "chaos"
principal = "intern"
tool = "read_file"
arguments = { path = "public/changelog.md" }
