[project]
name = "zero-trust-mcp-gateway"
version = "0.1.0"
description = "Default-deny MCP enforcement point built against the 2026-07-28 stateless specification"
requires-python = ">=3.12"
dependencies = [
    # PINNED, and the pin is a security control (ADR-002 §3). `mcp.shared.inbound`
    # performs unit 02's mirrored-metadata comparison, so an SDK upgrade can change
    # what the gateway believes a request MEANS. harness/scenarios/protocol_mirrored.toml
    # is the upgrade gate: bump this pin only with that corpus green, and record the
    # version it was validated against in tests/unit/test_sdk_pin.py.
    "mcp==2.0.0",  # official MCP Python SDK — upstream stdio leg AND the inbound ladder
    "pydantic>=2", # every model, config, and the audit schema
    "anyio",       # structured concurrency (the SDK is anyio-native)
    "httpx",       # OPA REST calls only
    "jsonschema",  # tool argument validation against MCP inputSchema
    "uvicorn",     # ASGI server for the loopback HTTP client edge (ADR-001)
]

# Deliberately absent — see _tech/00-conventions.md §1:
#   orjson    cannot detect duplicate keys, which would make PROTO_DUPLICATE_FIELD a lie
#   PyYAML    config is TOML via stdlib tomllib
#   structlog the audit log IS the log
#   fastapi   the edge is one path and one method; a router framework buys nothing

[project.optional-dependencies]
agent = ["pydantic-ai-slim[groq]"] # v1.1 only. CI proves CONV-016 by not installing it.

[dependency-groups]
dev = ["pytest", "pytest-anyio", "hypothesis", "ruff", "pyright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: spawns processes or kills them; excluded with -m 'not slow'. Applied AUTOMATICALLY to everything under tests/integration/ (see tests/conftest.py) — a marker that must be remembered stops being true, and this one had: five tests carried it by hand and the fast lane saved 12s of 3min. Expensive UNIT tests still need it explicitly, because nothing structural separates them from the fast ones beside them.",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["gateway", "harness", "scripts"]
typeCheckingMode = "strict"
reportMissingImports = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
